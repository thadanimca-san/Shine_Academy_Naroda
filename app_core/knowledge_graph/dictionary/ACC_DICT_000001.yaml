id: ACC_DICT_000001

term:
  english: Partnership
  hindi: साझेदारी
  gujarati: ભાગીદારી

subject:
  code: ACC
  name: Accountancy

chapter:
  code: ACC12_CH01
  title: Introduction to Partnership

class:
  board: Universal
  grades:
    - Class 11
    - Class 12
    - CA Foundation
    - Commerce

definition:
  beginner: >
    Partnership is when two or more people agree to run a business together,
    contribute resources, and share profits and losses according to an agreement.

  intermediate: >
    Partnership is a legal relationship between persons carrying on a lawful
    business with the object of earning profit and sharing it according to agreed terms.

  advanced: >
    Partnership is a contractual relationship governed by applicable partnership
    laws, where partners jointly own and manage a business while acting as agents
    of one another.

real_life_examples:
  - Two doctors opening a clinic.
  - Three engineers starting a software company.
  - Two sisters opening a bakery.
  - Chartered accountants starting a professional firm.

importance:
  accounting:
    - Foundation of partnership accounting
    - Capital Accounts
    - Current Accounts
    - Profit Sharing Ratio
    - Goodwill
    - Admission
    - Retirement
    - Death of Partner
    - Dissolution

related_terms:
  - Partner
  - Partnership Deed
  - Capital
  - Goodwill
  - Drawings
  - Profit Sharing Ratio
  - Mutual Agency

teacher_notes:
  misconception: >
    Students usually believe every partner must invest equal money.
    Clarify that investment and profit sharing can both differ.

practice:
