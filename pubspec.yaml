  ios: true
  image_path: "assets/icon/shine_academy_naroda_app_icon.jpg"
  remove_alpha_ios: true
  linux:
    generate: true
    image_path: "assets/icon/shine_academy_naroda_app_icon.jpg"
  windows:
    generate: true
    image_path: "assets/icon/shine_academy_naroda_app_icon.jpg"

