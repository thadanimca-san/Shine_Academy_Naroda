name: shine_academy_naroda
description: "Shine Academy Naroda - Learn with Understanding."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  provider: ^6.1.1
  pdf: ^3.10.7
  printing: ^5.11.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  lottie: ^3.5.1
  google_fonts: ^8.2.1
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  path_drawing: ^1.0.1
  path_provider: ^2.1.6
  flutter_markdown: ^0.7.7+1
  translator: ^1.0.4+1
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  open_filex: ^4.7.0
  screenshot: ^3.0.0
  device_info_plus: ^13.2.0
  flutter_markdown_latex: ^0.3.4
  flutter_math_fork: ^0.7.4
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/audio/
    - assets/icon/
    - assets/lottie/
    - assets/fonts/
    - assets/branding/
    - assets/images/
    # Class 9/10 science pictures (113 MB) are not used by SkillUp; leaving them out
    # keeps the SkillUp bundle under Google Play's 200 MB download limit.
    - path: assets/images/science/
      flavors: [primary, middle, highschool, commerce, achievers]
    - assets/dictionary/
    - assets/dictionary/universal_dictionary.db
    - assets/mentors/
    - app_core/chapters/
    - app_core/assessment/
    - app_core/knowledge_graph/dictionary/
    - app_core/knowledge_graph/dictionary_index.json
    # Dictionary files the app reads. generated_massive_dict.json and anomalies_to_fix.json
    # (88 MB) are working files for scripts/ and are not bundled into the apps.
